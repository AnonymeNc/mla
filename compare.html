<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare Mobile Legends: Adventure heroes side by side — rarity, faction, role, and full ability descriptions." />
    <meta property="og:title" content="Hero Comparison — MLA" />
    <meta property="og:description" content="Compare Mobile Legends: Adventure heroes side by side — rarity, faction, role, and full ability descriptions." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="manifest" href="./public/manifest.json" />
    <title>MLA Compare Heroes</title>
    <link rel="stylesheet" href="./src/styles/main.css?v=20260723-2" />
    <script defer src="./src/data/heroes.js?v=20260723-2"></script>
    <script type="module" src="./src/app.js?v=20260723-2"></script>
  </head>
  <body data-page="compare">
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow" data-i18n="siteTagline">Mobile Legends: Adventure</p>
        <h1 data-i18n="comparePageTitle">Compare Heroes</h1>
      </div>
      <div class="topbar__actions">
        <label class="lang-switch" for="language-switcher">
          <span class="lang-switch__label" data-i18n="languageLabel">Language</span>
          <select id="language-switcher">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="vi">Tiếng Việt</option>
            <option value="zh">中文</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <a class="nav-link" href="./index.html" data-i18n="backToCatalog">Back to catalog</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero-summary">
        <div>
          <p class="eyebrow" data-i18n="heroSummaryEyebrow">Guilded roster</p>
          <h2 data-i18n="comparePageTitle">Compare Heroes</h2>
          <p data-i18n="comparePageDescription">Pick two or three heroes to compare their rarity, faction, role, and abilities side by side.</p>
        </div>
      </section>

      <section class="controls" aria-label="Hero pickers">
        <label class="control-field">
          <span data-i18n="compareSlotA">Hero A</span>
          <input list="hero-datalist" id="compare-slot-a" data-i18n-placeholder="compareSelectHero" placeholder="Type a hero name" />
        </label>
        <label class="control-field">
          <span data-i18n="compareSlotB">Hero B</span>
          <input list="hero-datalist" id="compare-slot-b" data-i18n-placeholder="compareSelectHero" placeholder="Type a hero name" />
        </label>
        <label class="control-field">
          <span data-i18n="compareSlotC">Hero C (optional)</span>
          <input list="hero-datalist" id="compare-slot-c" data-i18n-placeholder="compareSelectHero" placeholder="Type a hero name" />
        </label>
      </section>
      <datalist id="hero-datalist"></datalist>

      <div id="compare-root"></div>
    </main>

    <footer class="site-footer">
      <p data-i18n="footerDisclaimer">Fan-made site, not affiliated with the game's publisher.</p>
      <nav class="site-footer__links">
        <a href="./about.html" data-i18n="footerAbout">About</a>
        <a href="./changelog.html" data-i18n="changelogNavLabel">What's New</a>
        <a href="https://github.com/AnonymeNc/mla" target="_blank" rel="noreferrer" data-i18n="footerSourceCode">Source code</a>
      </nav>
    </footer>
  </body>
</html>
