<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mechanics explainers, glossary, and beginner tips for Mobile Legends: Adventure, sourced from the community — sorted by topic." />
    <meta property="og:title" content="Guides & FAQ — Mobile Legends: Adventure" />
    <meta property="og:description" content="Mechanics explainers, glossary, and beginner tips for Mobile Legends: Adventure, sourced from the community." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="manifest" href="./public/manifest.json" />
    <title>MLA Guides &amp; FAQ</title>
    <link rel="stylesheet" href="./src/styles/main.css?v=20260723-2" />
    <script defer src="./src/data/guides.js?v=20260723-2"></script>
    <script type="module" src="./src/app.js?v=20260723-2"></script>
  </head>
  <body data-page="guides">
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow" data-i18n="siteTagline">Mobile Legends: Adventure</p>
        <h1 data-i18n="guidesPageTitle">Guides &amp; FAQ</h1>
      </div>
      <div class="topbar__actions">
        <label class="lang-switch" for="language-switcher">
          <span class="lang-switch__label" data-i18n="languageLabel">Language</span>
          <select id="language-switcher">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="vi">Tiếng Việt</option>
            <option value="zh">中文</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <a class="nav-link" href="./index.html" data-i18n="backToCatalog">Back to catalog</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero-summary">
        <div>
          <p class="eyebrow" data-i18n="guidesEyebrow">Community knowledge base</p>
          <h2 data-i18n="guidesPageTitle">Guides &amp; FAQ</h2>
          <p data-i18n="guidesPageDescription">Mechanics explainers, glossary, and beginner tips sourced from the community — sorted by topic.</p>
        </div>
      </section>

      <section class="controls" aria-label="Guide search">
        <label class="control-field control-field--wide">
          <span data-i18n="searchLabel">Search</span>
          <input id="guide-search-input" type="search" data-i18n-placeholder="guideSearchPlaceholder" placeholder="Search guides…" />
        </label>
      </section>

      <div id="guides-root" class="guide-categories"></div>
    </main>

    <footer class="site-footer">
      <p data-i18n="footerDisclaimer">Fan-made site, not affiliated with the game's publisher.</p>
      <nav class="site-footer__links">
        <a href="./about.html" data-i18n="footerAbout">About</a>
        <a href="./changelog.html" data-i18n="changelogNavLabel">What's New</a>
        <a href="https://github.com/AnonymeNc/mla" target="_blank" rel="noreferrer" data-i18n="footerSourceCode">Source code</a>
      </nav>
    </footer>

  </body>
</html>
