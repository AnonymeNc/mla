name: Update hero data

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rescrape wiki and rebuild hero data
        run: node scripts/build-hero-data.js

      - name: Validate hero data
        run: node scripts/validate-heroes.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/heroes.js; then
            echo "No changes to hero data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/heroes.js
          git commit -m "Auto-update hero data from wiki"
          git push
